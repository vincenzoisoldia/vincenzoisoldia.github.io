# Reading group (appare nella pagina Teaching).
# Finché "name" è vuoto, la sezione non viene mostrata sul sito.
#
# Ogni incontro: date, topic, speaker, e opzionalmente note (es. orario diverso)
# e notes (link a un PDF). "closing" è una riga mostrata sotto l'elenco.
#
# Esempio:
#   - date: 16 Oct 2026
#     topic: Hitchin components
#     speaker: V. A. Isoldi
#     note: Exceptionally at 11:00.
#     notes: /files/teaching/reading-group/01-hitchin.pdf

name: Teichmüller Theory Reading Group
description: >-
  We are working through Bram Petri's
  [lecture notes on Teichmüller theory](https://webusers.imj-prg.fr/~bram.petri/t_tt/notes_250331.pdf).
  We meet on Mondays at 10:30 in A3 01 (Sophus-Lie room).
  Organized by Vincenzo Antonio Isoldi and Laura Lankers.
meetings:
