    topic: Reminder on surfaces
    speaker: Vincenzo Antonio Isoldi
  - date: 12 Oct 2026
    topic: Quotients, metrics and conformal structures
    speaker: Laura Lankers and Vincenzo Antonio Isoldi
  - date: 19 Oct 2026
    topic: The Teichmüller space of the torus
    speaker: Juan Sebastian Numpaque Roa
    note: Exceptionally starting at 11:00.
  - date: 26 Oct 2026
    topic: Markings, mapping class groups and moduli spaces
    speaker: Perrine Jouteur
